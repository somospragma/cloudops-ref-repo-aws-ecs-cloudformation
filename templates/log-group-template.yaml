AWSTemplateFormatVersion: 2010-09-09
Description: Esta plantilla de CloudFormation despliega un Log Group de CloudWatch Logs.

Parameters:
  pCustomerName:
    Description: Nombre del cliente
    Type: String
  pProjectName:
    Description: Nombre del proyecto 
    Type: String
  pEnvironment:
    Description: Ambiente del despliegue
    Type: String
    AllowedValues: [qa, dev, pdn, prepdn]
  pApplication:
    Description: Aplicacion, servicio o funcionalidad del negocio
    Type: String
  pCostCenter:
    Description: Centro de costos que pertenece este recurso
    Type: String
  pOwner:
    Description: Nombre de la persona encargada del proyecto
    Type: String
  pArea:
    Description: Nombre del area
    Type: String
  pLogGroupClass:
    Description: Clase de almacenamiento para el Log Group (STANDARD o INFREQUENT_ACCESS)
    Type: String
    AllowedValues: ["STANDARD", "INFREQUENT_ACCESS", "DELIVERY"]
    Default: "STANDARD"
  pLogGroupRetentionInDays:
    Description: Número de días para retener los logs en el Log Group (0 para retener indefinidamente)
    Type: String
    Default: "7"
  pKmsArn:
    Description: ARN de la clave KMS para cifrar el Log Group (dejar vacío si no se desea cifrar)
    Type: String
    Default: ""

Conditions:
 cApplyKms: !Not [!Equals [!Ref pKmsArn, ""]]
Resources:
  rLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "${pCustomerName}-${pProjectName}-${pEnvironment}-lg-${pApplication}"
      LogGroupClass: !Ref pLogGroupClass
      RetentionInDays: !Ref pLogGroupRetentionInDays
      KmsKeyId: !If 
        - cApplyKms
        - !Ref pKmsArn
        - !Ref "AWS::NoValue"
      Tags:
        - Key: environment
          Value: !Ref pEnvironment
        - Key: project-name
          Value: !Ref pProjectName
        - Key: cost-center
          Value: !Ref pCostCenter
        - Key: owner
          Value: !Ref pOwner
        - Key: area
          Value: !Ref pArea
Outputs:
  oLogGroupName:
    Description: "Nombre del Log Group creado"
    Value: !Ref rLogGroup
  oLogGroupArn:
    Description: "ARN del Log Group donde se almacenan los logs"
    Value: !GetAtt rLogGroup.Arn