AWSTemplateFormatVersion: 2010-09-09
Description: Esta plantilla de CloudFormation despliega un Application Load Balancer, Network Load Balancer o Gateway Load Balancer.

Parameters:
  pCustomerName:
    Description: Nombre del cliente
    Type: String
  pProjectName:
    Description: Nombre del proyecto 
    Type: String
  pEnvironment:
    Description: Ambiente del despliegue
    Type: String
    AllowedValues: [qa, dev, pdn, prepdn]
  pApplication:
    Description: Aplicacion, servicio o funcionalidad del negocio
    Type: String
  pCostCenter:
    Description: Centro de costos que pertenece este recurso
    Type: String
  pOwner:
    Description: Nombre de la persona encargada del proyecto
    Type: String
  pArea:
    Description: Nombre del area
    Type: String
  pType:
    Description: Tipo de ELB a desplegar
    Type: String
    AllowedValues: [application, network, gateway]
  pScheme:
    Description: Esquema del ELB a desplegar
    Type: String
    AllowedValues: [internet-facing, internal]
  pIdSecurityGroups:
    Description: Lista de IDs de grupos de seguridad a asociar al ELB
    Type: CommaDelimitedList
  pIdSubnets:
    Description: Lista de IDs de subnets a asociar al ELB
    Type: CommaDelimitedList
  pIpAddressType:
    Description: Tipo de dirección IP para el ELB
    Type: String
    AllowedValues: [ipv4, dualstack, dualstack-without-public-ipv4]
    Default: ipv4
  pEnforceSecurityGroupInboundRulesOnPrivateLinkTraffic:
    Description: Indica si se deben aplicar las reglas de entrada del grupo de seguridad al tráfico de PrivateLink
    Type: String
    AllowedValues: [on, off]
    Default: off
  pEnablePrefixForIpv6SourceNat:
    Description: Indica si se debe habilitar el prefijo para NAT de origen IPv6
    Type: String
    AllowedValues: [on, off]
    Default: off

Mappings:
  mElbTypeAcronym:
    application:
      acronym: alb
    network:
      acronym: nlb
    gateway:
      acronym: gwlb

Conditions:
  CDeclaredpEnforceSecurityGroupInboundRulesOnPrivateLinkTraffic: !Equals [!Ref pEnforceSecurityGroupInboundRulesOnPrivateLinkTraffic, "on"]
  CDeclaredpEnablePrefixForIpv6SourceNat: !Equals [!Ref pEnablePrefixForIpv6SourceNat, "on"]

Resources:
  rElb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub
        - ${pCustomerName}-${pProjectName}-${pEnvironment}-${Acronym}-${pApplication}
        - Acronym: !FindInMap [mElbTypeAcronym, !Ref pType, acronym]
      Type: !Ref pType
      Scheme: !Ref pScheme
      SecurityGroups: !Ref pIdSecurityGroups
      Subnets: !Ref pIdSubnets
      IpAddressType: !Ref pIpAddressType
      EnforceSecurityGroupInboundRulesOnPrivateLinkTraffic: !If
        - CDeclaredpEnforceSecurityGroupInboundRulesOnPrivateLinkTraffic
        - !Ref pEnforceSecurityGroupInboundRulesOnPrivateLinkTraffic
        - !Ref AWS::NoValue
      EnablePrefixForIpv6SourceNat: !If
        - CDeclaredpEnablePrefixForIpv6SourceNat
        - !Ref pEnablePrefixForIpv6SourceNat
        - !Ref AWS::NoValue
      Tags: 
        - Key: environment
          Value: !Ref pEnvironment
        - Key: project-name
          Value: !Ref pProjectName
        - Key: cost-center
          Value: !Ref pCostCenter
        - Key: owner
          Value: !Ref pOwner
        - Key: area
          Value: !Ref pArea

Outputs:
  oHostedZoneId:
    Description: ID de la zona hospedada del ELB
    Value: !GetAtt rElb.CanonicalHostedZoneID
  oDnsName:
    Description: Nombre DNS del ELB
    Value: !GetAtt rElb.DNSName
  oElbArn:
    Description: ARN del ELB
    Value: !GetAtt rElb.LoadBalancerArn
  oElbFullName:
    Description: Nombre completo del ELB
    Value: !GetAtt rElb.LoadBalancerFullName
  oElbName:
    Description: Nombre del ELB
    Value: !GetAtt rElb.LoadBalancerName