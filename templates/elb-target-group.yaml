AWSTemplateFormatVersion: 2010-09-09
Description: Esta plantilla de CloudFormation despliega un Target Group para un Application Load Balancer o Network Load Balancer.

Parameters:
  pCustomerName:
    Description: Nombre del cliente
    Type: String
  pProjectName:
    Description: Nombre del proyecto 
    Type: String
  pEnvironment:
    Description: Ambiente del despliegue
    Type: String
    AllowedValues: [qa, dev, pdn, prepdn]
  pApplication:
    Description: Aplicacion, servicio o funcionalidad del negocio
    Type: String
  pCostCenter:
    Description: Centro de costos que pertenece este recurso
    Type: String
  pOwner:
    Description: Nombre de la persona encargada del proyecto
    Type: String
  pArea:
    Description: Nombre del area
    Type: String
  pPort:
    Description: Puerto de escucha del Target Group
    Type: String
  pProtocol:
    Description: Protocolo de escucha del Target Group
    Type: String
    AllowedValues: [HTTP, HTTPS, TCP, TLS, UDP, TCP_UDP]
  pTargetType:
    Description: Tipo de destino del Target Group
    Type: String
    AllowedValues: [instance, ip, lambda, alb]
  pVpcId:
    Description: ID de la VPC donde se creará el Target Group
    Type: String
  pProtocolVersion:
    Description: Versión del protocolo (solo aplicable para ALB)
    Type: String
    Default: ""
  pIpAddressType:
    Description: Tipo de dirección IP para el Target Group
    Type: String
    Default: ipv4
  pHealthCheckEnabled:
    Description: Habilitar o deshabilitar las comprobaciones de estado
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
  pHealthCheckIntervalSeconds:
    Description: Intervalo entre comprobaciones de estado (en segundos)
    Type: String
  pHealthCheckPath:
    Description: Ruta para las comprobaciones de estado (solo aplicable para HTTP/HTTPS)
    Type: String
  pHealthCheckPort:
    Description: Puerto para las comprobaciones de estado
    Type: String
  pHealthCheckProtocol:
    Description: Protocolo para las comprobaciones de estado
    Type: String
  pHealthCheckTimeoutSeconds:
    Description: Tiempo de espera para las comprobaciones de estado (en segundos)
    Type: String
  pHealthyThresholdCount:
    Description: Número de comprobaciones de estado exitosas para considerar un destino como saludable
    Type: String
  pUnhealthyThresholdCount:
    Description: Número de comprobaciones de estado fallidas para considerar un destino como no saludable
    Type: String

Conditions:
  cApplyProtocolVersion: !Not [!Equals [!Ref pProtocolVersion, ""]]
  cApplyHealthCheckConfiguration: !Equals [!Ref pHealthCheckEnabled, "true"]

Resources:
  rTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${pCustomerName}-${pProjectName}-${pEnvironment}-tg-${pApplication}"
      Port: !Ref pPort
      Protocol: !Ref pProtocol
      ProtocolVersion: !If [cApplyProtocolVersion, !Ref pProtocolVersion, !Ref AWS::NoValue]
      TargetType: !Ref pTargetType
      VpcId: !Ref pVpcId
      IpAddressType: !Ref pIpAddressType

      HealthCheckEnabled: !Ref pHealthCheckEnabled
      HealthCheckIntervalSeconds: !If [cApplyHealthCheckConfiguration, !Ref pHealthCheckIntervalSeconds, !Ref AWS::NoValue]
      HealthCheckPath: !If [cApplyHealthCheckConfiguration, !Ref pHealthCheckPath, !Ref AWS::NoValue]
      HealthCheckPort: !If [cApplyHealthCheckConfiguration, !Ref pHealthCheckPort, !Ref AWS::NoValue]
      HealthCheckProtocol: !If [cApplyHealthCheckConfiguration, !Ref pHealthCheckProtocol, !Ref AWS::NoValue]
      HealthCheckTimeoutSeconds: !If [cApplyHealthCheckConfiguration, !Ref pHealthCheckTimeoutSeconds, !Ref AWS::NoValue]
      HealthyThresholdCount: !If [cApplyHealthCheckConfiguration, !Ref pHealthyThresholdCount, !Ref AWS::NoValue]
      UnhealthyThresholdCount: !If [cApplyHealthCheckConfiguration, !Ref pUnhealthyThresholdCount, !Ref AWS::NoValue]

      Tags: 
        - Key: environment
          Value: !Ref pEnvironment
        - Key: project-name
          Value: !Ref pProjectName
        - Key: cost-center
          Value: !Ref pCostCenter
        - Key: owner
          Value: !Ref pOwner
        - Key: area
          Value: !Ref pArea

Outputs:
  oTargetGroupArn:
    Description: ARN del Target Group
    Value: !GetAtt rTargetGroup.TargetGroupArn
  oTargetGroupFullName:
    Description: Nombre completo del Target Group
    Value: !GetAtt rTargetGroup.TargetGroupFullName
  oTargetGroupName:
    Description: Nombre del Target Group
    Value: !GetAtt rTargetGroup.TargetGroupName