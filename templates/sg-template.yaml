AWSTemplateFormatVersion: '2010-09-09'
Description: Esta plantilla de CloudFormation despliega un Security Group en una VPC.

Parameters:
  pCustomerName:
    Description: Nombre del cliente
    Type: String
  pProjectName:
    Description: Nombre del proyecto 
    Type: String
  pEnvironment:
    Description: Ambiente del despliegue
    Type: String
    AllowedValues: [qa, dev, pdn, prepdn]
  pApplication:
    Description: Aplicacion, servicio o funcionalidad del negocio
    Type: String
  pCostCenter:
    Description: Centro de costos que pertenece este recurso
    Type: String
  pOwner:
    Description: Nombre de la persona encargada del proyecto
    Type: String
  pArea:
    Description: Nombre del area
    Type: String
  pVpcId:
    Description: ID de la VPC a la que se asociará el Security Group
    Type: String
  pSgName:
    Description: Nombre del Security Group
    Type: String
    Default: ""
  pSgDescription:
    Description: Descripción del Security Group
    Type: String

Resources:
  rSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${pCustomerName}-${pProjectName}-${pEnvironment}-sg-${pApplication}"
      GroupDescription: !Ref pSgDescription
      VpcId: !Ref pVpcId
      Tags:
        - Key: environment
          Value: !Ref pEnvironment
        - Key: project-name
          Value: !Ref pProjectName
        - Key: cost-center
          Value: !Ref pCostCenter
        - Key: owner
          Value: !Ref pOwner
        - Key: area
          Value: !Ref pArea

Outputs:
  oSgId:
    Description: ID del Security Group
    Value: !GetAtt rSecurityGroup.GroupId